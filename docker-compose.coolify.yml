# Coolify deployment of Flowsint on the Dockerfarm (dockerops).
# Derived from upstream docker-compose.prod.yml. Changes, and why:
#  - Only the UI is published. Postgres, Redis, Neo4j and the API stay on the compose network.
#  - The UI binds FLOWSINT_BIND_IP:FLOWSINT_HOST_PORT. The default is loopback so a lost
#    variable fails closed. Coolify sets the Tailscale address.
#  - The /var/run/docker.sock mounts are removed. Upstream uses them only so six scanning
#    enrichers (subfinder, dnsx, httpx, mapcidr, naabu, asnmap) can launch tool containers.
#    Those six fail with "Failed to connect to Docker daemon" until the socket decision changes.
#  - container_name is removed. The app container starts nginx on a /tmp copy of the image's own
#    config with FLOWSINT_ALLOWED_HOST_RE added to the Host allowlist. Without it nginx answers
#    403 to any Host other than localhost. Coolify sets the variable to the Tailscale address.
#  - Secrets come from Coolify env (no defaults), so nothing secret is in this repo.
name: flowsint

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowsint
      POSTGRES_PASSWORD: ${FLOWSINT_POSTGRES_PASSWORD:?set in Coolify}
      POSTGRES_DB: flowsint
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsint"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${FLOWSINT_NEO4J_PASSWORD:?set in Coolify}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # Bounded so it is a good neighbour on a shared host.
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${FLOWSINT_NEO4J_PASSWORD}\" \"RETURN 1\""]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 60s

  api:
    # Upstream image plus our changes (see deploy/Dockerfile.api). celery builds the same image.
    build:
      context: ./deploy
      dockerfile: Dockerfile.api
      args:
        FLOWSINT_VERSION: ${FLOWSINT_VERSION:-1.2.13}
    image: flowsint-api-openai:${FLOWSINT_VERSION:-1.2.13}
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://flowsint:${FLOWSINT_POSTGRES_PASSWORD}@postgres:5432/flowsint
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${FLOWSINT_NEO4J_PASSWORD}
      - AUTH_SECRET=${FLOWSINT_AUTH_SECRET:?set in Coolify}
      - MASTER_VAULT_KEY_V1=${FLOWSINT_MASTER_VAULT_KEY:?set in Coolify}
      - REDIS_URL=redis://redis:6379/0
      # Flo (the AI assistant) runs on MiniMax through Flowsint's OpenAI provider; the openai SDK
      # reads OPENAI_BASE_URL itself. With no per-user OPENAI_API_KEY in the vault, Flowsint falls
      # back to OPENAI_API_KEY here. The chat UI separately needs a vault key named MISTRAL_API_KEY
      # to count as active (see 01_CURRENT-STATE.md).
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${FLOWSINT_LLM_API_KEY:-}
      - OPENAI_BASE_URL=${FLOWSINT_LLM_BASE_URL:-https://api.minimax.io/v1}
      - LLM_MODEL=${FLOWSINT_LLM_MODEL:-MiniMax-M3}
      # Tools on dockerops that the custom enrichers call. Keys come from Bitwarden via Coolify env.
      - SPIDERFOOT_URL=${FLOWSINT_SPIDERFOOT_URL:-http://100.93.251.35:2910}
      - ABUSEBOX_URL=${FLOWSINT_ABUSEBOX_URL:-http://100.93.251.35:2915}
      - HEXBRAIN_URL=${FLOWSINT_HEXBRAIN_URL:-http://100.93.251.35:2921}
      - HEXBRAIN_API_KEY=${FLOWSINT_HEXBRAIN_API_KEY:-}
      - DEFECTDOJO_URL=${FLOWSINT_DEFECTDOJO_URL:-https://ddojo.techbrooks.ca}
      - DEFECTDOJO_API_TOKEN=${FLOWSINT_DEFECTDOJO_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    # Same custom image as the api: enrichers run here.
    build:
      context: ./deploy
      dockerfile: Dockerfile.api
      args:
        FLOWSINT_VERSION: ${FLOWSINT_VERSION:-1.2.13}
    image: flowsint-api-openai:${FLOWSINT_VERSION:-1.2.13}
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "flowsint_core.core.celery",
        "worker",
        "--loglevel=info",
        "--pool=threads",
        "--concurrency=10",
      ]
    environment:
      - DATABASE_URL=postgresql://flowsint:${FLOWSINT_POSTGRES_PASSWORD}@postgres:5432/flowsint
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${FLOWSINT_NEO4J_PASSWORD}
      - MASTER_VAULT_KEY_V1=${FLOWSINT_MASTER_VAULT_KEY}
      - REDIS_URL=redis://redis:6379/0
      - SKIP_MIGRATIONS=true
      - AUTH_SECRET=${FLOWSINT_AUTH_SECRET}
      # Tools on dockerops that the custom enrichers call. Keys come from Bitwarden via Coolify env.
      - SPIDERFOOT_URL=${FLOWSINT_SPIDERFOOT_URL:-http://100.93.251.35:2910}
      - ABUSEBOX_URL=${FLOWSINT_ABUSEBOX_URL:-http://100.93.251.35:2915}
      - HEXBRAIN_URL=${FLOWSINT_HEXBRAIN_URL:-http://100.93.251.35:2921}
      - HEXBRAIN_API_KEY=${FLOWSINT_HEXBRAIN_API_KEY:-}
      - DEFECTDOJO_URL=${FLOWSINT_DEFECTDOJO_URL:-https://ddojo.techbrooks.ca}
      - DEFECTDOJO_API_TOKEN=${FLOWSINT_DEFECTDOJO_API_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "celery -A flowsint_core.core.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      api:
        condition: service_healthy

  app:
    image: ghcr.io/reconurge/flowsint-app:${FLOWSINT_VERSION:-1.2.13}
    restart: unless-stopped
    ports:
      - "${FLOWSINT_BIND_IP:-127.0.0.1}:${FLOWSINT_HOST_PORT:-2920}:8080"
    environment:
      # Regex for the Host header nginx will accept besides localhost (DNS-rebinding defence).
      - FLOWSINT_ALLOWED_HOST_RE=${FLOWSINT_ALLOWED_HOST_RE:-localhost}
    # The image's nginx.conf allows only localhost Hosts and answers 403 otherwise. Coolify's
    # build host does not keep repo files, so a bind-mounted conf fails. Instead, copy the
    # image's own conf to /tmp with one extra allowlist line, then start nginx on that copy.
    command:
      - /bin/sh
      - -c
      - |
        awk '{print} /^ *default 0;/ {printf "        \"~*^%s(:[0-9]+)?$$\" 1;\n", ENVIRON["FLOWSINT_ALLOWED_HOST_RE"]}' /etc/nginx/nginx.conf > /tmp/nginx.conf && exec nginx -g 'daemon off;' -c /tmp/nginx.conf
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
